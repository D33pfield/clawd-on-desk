<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* Dozing — looping gentle breathing in yawn-end squashed pose, eyes shut */
      .doze-body {
        transform-origin: 7.5px 13px;
        animation: doze-breathe 4s infinite ease-in-out;
      }

      .doze-shadow {
        transform-origin: 7.5px 15.5px;
        animation: doze-shadow 4s infinite ease-in-out;
      }

      .eyes-shut {
        transform-origin: 7.5px 9px;
        transform: scaleY(0.1);
        transition: transform 0.3s ease-out;
      }

      .arm-l-doze {
        transform-origin: 1px 10px;
        transform: translate(0px, 1px) rotate(-15deg);
      }

      .arm-r-doze {
        transform-origin: 14px 10px;
        transform: translate(0px, 1px) rotate(15deg);
      }

      @keyframes doze-breathe {
        0%, 100% { transform: scale(1.05, 0.95) translate(0, 1px); }
        50% { transform: scale(1.08, 0.92) translate(0, 1.8px); }
      }

      @keyframes doze-shadow {
        0%, 100% { transform: scaleX(1.05); opacity: 0.55; }
        50% { transform: scaleX(1.08); opacity: 0.5; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="doze-shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.55"/>

  <!-- Static Legs -->
  <g id="legs" fill="#DE886D">
    <rect x="3" y="12" width="1" height="3"/>
    <rect x="5" y="12" width="1" height="3"/>
    <rect x="9" y="12" width="1" height="3"/>
    <rect x="11" y="12" width="1" height="3"/>
  </g>

  <!-- Dozing Body (squashed yawn-end pose + gentle breathing) -->
  <g class="doze-body">
    <!-- Torso -->
    <rect x="2" y="6" width="11" height="7" fill="#DE886D"/><g class="od-hat"><rect x="-1" y="4" width="1" height="1" fill="#A5682A"/><rect x="15" y="4" width="1" height="1" fill="#A5682A"/><rect x="0" y="5" width="15" height="1" fill="#A5682A"/><rect x="3" y="2" width="9" height="3" fill="#A5682A"/><rect x="3" y="1" width="3" height="1" fill="#A5682A"/><rect x="9" y="1" width="3" height="1" fill="#A5682A"/><rect x="3" y="4" width="9" height="1" fill="#6B3E1D"/></g><g class="od-cig" style="display:inline"><rect x="12" y="11" width="3" height="1" fill="#EDEDE3"/><rect x="14.4" y="11" width="0.6" height="1" fill="#FF8C00" class="od-ember"/><rect x="14" y="9.4" width="0.8" height="0.8" fill="#9E9E9E" class="od-smoke od-s1"/><rect x="14.2" y="7.4" width="0.7" height="0.7" fill="#B0B0B0" class="od-smoke od-s2"/><rect x="13.8" y="5.4" width="0.6" height="0.6" fill="#C4C4C4" class="od-smoke od-s3"/></g>
    <!-- Left Arm (relaxed down) -->
    <g class="arm-l-doze">
      <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
    </g>
    <!-- Right Arm (relaxed down) -->
    <g class="arm-r-doze">
      <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
    </g>
    <!-- Eyes shut (JS can open via style.transform override) -->
    <g id="eyes-doze" class="eyes-shut" fill="#000000">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
  </g>
<style>.od-ember{animation:od-ember 1.6s infinite ease-in-out}@keyframes od-ember{0%,100%{opacity:.55}50%{opacity:1}}.od-smoke{opacity:0}.od-s1{animation:od-rise 3s infinite linear}.od-s2{animation:od-rise 3s infinite linear;animation-delay:1s}.od-s3{animation:od-rise 3s infinite linear;animation-delay:2s}@keyframes od-rise{0%{transform:translate(0,1.5px);opacity:0}25%{opacity:.8}100%{transform:translate(1px,-4px);opacity:0}}</style></svg>
