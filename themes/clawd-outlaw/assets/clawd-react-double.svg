<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      .body-react {
        animation: body-panic 3.5s 1 ease-in-out forwards;
      }
      .eyes-react {
        animation: eyes-panic 3.5s 1 ease-in-out forwards;
      }
      .eyes-blink {
        transform-origin: 7.5px 9px;
        animation: blink 3s infinite linear;
      }
      .question-pop {
        transform-origin: center;
        animation: question-fade 3.5s 1 ease-in-out forwards;
        opacity: 0;
      }
      .exclamation-pop {
        transform-origin: center;
        animation: excl-fade 3.5s 1 ease-in-out forwards;
        opacity: 0;
      }

      /* Frantic left-right looking */
      @keyframes body-panic {
        0%, 4%   { transform: translate(0px, 0px); }
        10%, 18% { transform: translate(-1px, 0px); }
        24%, 32% { transform: translate(1px, 0px); }
        36%      { transform: translate(-1px, 0px); }
        40%      { transform: translate(1px, 0px); }
        46%, 72% { transform: translate(1px, -1px); }
        82%, 100%{ transform: translate(0px, 0px); }
      }

      @keyframes eyes-panic {
        0%, 4%   { transform: translate(0px, 0px); }
        10%, 18% { transform: translate(-2px, 0px); }
        24%, 32% { transform: translate(2px, 0px); }
        36%      { transform: translate(-2px, 0px); }
        40%      { transform: translate(2px, 0px); }
        46%, 72% { transform: translate(3px, -2px); }
        82%, 100%{ transform: translate(0px, 0px); }
      }

      @keyframes blink {
        0%, 20%, 24%, 60%, 64%, 80%, 84%, 100% { transform: scaleY(1); }
        22%, 62%, 82% { transform: scaleY(0.1); }
      }

      /* Question mark appears early (while looking left) */
      @keyframes question-fade {
        0%, 6%   { opacity: 0; transform: translate(-4px, 4px) scale(0.5); }
        12%, 38% { opacity: 1; transform: translate(-4px, 0px) scale(1); }
        44%, 100%{ opacity: 0; transform: translate(-4px, -4px) scale(1.2); }
      }

      /* Exclamation appears later (while staring up-right) */
      @keyframes excl-fade {
        0%, 42%  { opacity: 0; transform: translate(6px, 0px) scale(0.5); }
        48%, 72% { opacity: 1; transform: translate(6px, -4px) scale(1); }
        80%, 100%{ opacity: 0; transform: translate(6px, -8px) scale(1.2); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Static Legs (extended upward to prevent gap when body shifts up) -->
  <g fill="#DE886D">
    <rect x="3" y="11" width="1" height="4"/>
    <rect x="5" y="11" width="1" height="4"/>
    <rect x="9" y="11" width="1" height="4"/>
    <rect x="11" y="11" width="1" height="4"/>
  </g>

  <!-- Animated Upper Body -->
  <g class="body-react">
    <g fill="#DE886D">
      <rect x="2" y="6" width="11" height="7"/><g class="od-hat"><rect x="-1" y="4" width="1" height="1" fill="#A5682A"/><rect x="15" y="4" width="1" height="1" fill="#A5682A"/><rect x="0" y="5" width="15" height="1" fill="#A5682A"/><rect x="3" y="2" width="9" height="3" fill="#A5682A"/><rect x="3" y="1" width="3" height="1" fill="#A5682A"/><rect x="9" y="1" width="3" height="1" fill="#A5682A"/><rect x="3" y="4" width="9" height="1" fill="#6B3E1D"/></g><g class="od-cig" style="display:inline"><rect x="12" y="11" width="3" height="1" fill="#EDEDE3"/><rect x="15" y="11" width="1" height="1" fill="#FF5A00" class="od-ember"><animate attributeName="fill" values="#E03A00;#FF7A1A;#E03A00" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.85;1;0.85" dur="1.6s" repeatCount="indefinite"/></rect><rect x="15" y="10" width="0.9" height="0.9" fill="#9E9E9E" opacity="0" class="od-smoke"><animate attributeName="opacity" values="0;0.85;0.8;0.5;0" keyTimes="0;0.12;0.55;0.85;1" dur="2.7s" begin="-0.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;0.2 -1.2;-0.3 -2.4;0.5 -3.6;0 -4.8;0.7 -6" dur="2.7s" begin="-0.2s" repeatCount="indefinite"/></rect><rect x="15" y="10" width="0.8" height="0.8" fill="#B0B0B0" opacity="0" class="od-smoke"><animate attributeName="opacity" values="0;0.85;0.8;0.5;0" keyTimes="0;0.12;0.55;0.85;1" dur="2.7s" begin="-1.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;0.2 -1.2;-0.3 -2.4;0.5 -3.6;0 -4.8;0.7 -6" dur="2.7s" begin="-1.1s" repeatCount="indefinite"/></rect><rect x="15" y="10" width="0.7" height="0.7" fill="#C4C4C4" opacity="0" class="od-smoke"><animate attributeName="opacity" values="0;0.85;0.8;0.5;0" keyTimes="0;0.12;0.55;0.85;1" dur="2.7s" begin="-2.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" calcMode="discrete" values="0 0;0.2 -1.2;-0.3 -2.4;0.5 -3.6;0 -4.8;0.7 -6" dur="2.7s" begin="-2.0s" repeatCount="indefinite"/></rect></g>
      <rect x="0" y="9" width="2" height="2"/>
      <rect x="13" y="9" width="2" height="2"/>
    </g>
    <g class="eyes-react">
      <g class="eyes-blink" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>
    </g>
  </g>

  <!-- Question Mark (left side) -->
  <g class="question-pop" fill="#FFFFFF">
    <rect x="1" y="0" width="2" height="1"/>
    <rect x="0" y="1" width="1" height="1"/>
    <rect x="3" y="1" width="1" height="2"/>
    <rect x="2" y="3" width="1" height="1"/>
    <rect x="1" y="4" width="1" height="1"/>
    <rect x="1" y="6" width="1" height="1"/>
  </g>

  <!-- Exclamation Mark (right side) -->
  <g class="exclamation-pop" fill="#0082FC">
    <rect x="1" y="0" width="1" height="4"/>
    <rect x="1" y="5" width="1" height="1"/>
  </g>
</svg>
