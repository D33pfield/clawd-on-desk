<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  user-select: none;
  pointer-events: none;
  cursor: default;
  /* A terminal face: Cascadia ships with Windows, Consolas is the fallback. */
  font-family: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", "Liberation Mono", monospace;
  -webkit-font-smoothing: antialiased;
}

/* Styled after the thinking animation's thought bubble: flat white, pixel-notched
   corners, no border, and a trail of small square puffs down to the pet's head. */
#wrap {
  position: absolute;
  bottom: 2px;
  opacity: 0;
  transform: translateY(3px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  /* A faint edge so white stays visible on a light desktop. */
  filter: drop-shadow(0 0 1px rgba(30, 50, 70, 0.55)) drop-shadow(0 2px 3px rgba(0, 0, 0, 0.18));
}
#wrap.below { bottom: auto; top: 2px; transform: translateY(-3px); }
#wrap.show { opacity: 1; transform: translateY(0); }

#bubble {
  max-width: 316px;
  margin-bottom: 24px;
  padding: 10px 16px 11px;
  background: #ffffff;
  color: #14293a;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
  text-align: left;
  pointer-events: auto;
  cursor: pointer;
  /* One-step pixel notch on each corner, like the SVG bubble path. */
  clip-path: polygon(
    6px 0, calc(100% - 6px) 0, calc(100% - 6px) 3px, 100% 3px,
    100% calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%, 6px 100%,
    6px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 6px 3px
  );
}
#wrap.below #bubble { margin-bottom: 0; margin-top: 24px; }

/* The full text sits invisibly in the same grid cell as the typed text, so the
   bubble has its final size from the first character and nothing jumps. */
#textbox { display: grid; }
#ghost, #typed { grid-area: 1 / 1; white-space: pre-wrap; overflow-wrap: anywhere; }
#ghost { visibility: hidden; }

/* A blinking block cursor while typing, like a terminal. */
#typed.typing::after { content: "\2588"; margin-left: 1px; animation: blink 0.8s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.puff { position: absolute; background: #ffffff; }
#puff1 { width: 8px; height: 8px; bottom: 11px; }
#puff2 { width: 5px; height: 5px; bottom: 2px; }
#wrap.below #puff1 { bottom: auto; top: 11px; }
#wrap.below #puff2 { bottom: auto; top: 2px; }

@media (prefers-reduced-motion: reduce) {
  #wrap { transition: none; transform: none; }
  #typed.typing::after { animation: none; }
}
</style>
</head>
<body>
<div id="wrap">
  <div id="bubble"><div id="textbox"><span id="ghost"></span><span id="typed"></span></div></div>
  <div class="puff" id="puff1"></div>
  <div class="puff" id="puff2"></div>
</div>
<script>
const wrap = document.getElementById("wrap");
const bubble = document.getElementById("bubble");
const ghost = document.getElementById("ghost");
const typed = document.getElementById("typed");
const puff1 = document.getElementById("puff1");
const puff2 = document.getElementById("puff2");
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let typingTimer = null;

function stopTyping() {
  if (typingTimer) clearInterval(typingTimer);
  typingTimer = null;
  typed.classList.remove("typing");
}

// Reveal the text one character at a time. textContent only, never markup.
function typeText(text, charMs) {
  stopTyping();
  typed.textContent = "";
  if (reduceMotion || !(charMs > 0)) {
    typed.textContent = text;
    return;
  }
  let shown = 0;
  typed.classList.add("typing");
  typingTimer = setInterval(() => {
    shown += 1;
    typed.textContent = text.slice(0, shown);
    if (shown >= text.length) stopTyping();
  }, charMs);
}

// Keep the puff trail aimed at the pet: slide the bubble so its center is near
// tailX, within the window, then trail the puffs down from that point.
function place(tailX, below) {
  wrap.classList.toggle("below", below === true);
  const width = wrap.offsetWidth;
  const x = Number.isFinite(tailX) ? tailX : window.innerWidth / 2;
  const left = Math.max(4, Math.min(x - width / 2, window.innerWidth - width - 4));
  wrap.style.left = left + "px";
  const anchor = Math.max(14, Math.min(x - left, width - 14));
  puff1.style.left = Math.round(anchor - 4) + "px";
  puff2.style.left = Math.round(anchor - 2) + "px";
}

// Model output is untrusted: textContent only, never markup.
window.chatterBubbleAPI.onShow((data) => {
  if (!data || typeof data.text !== "string") return;
  if (data.quiet) {
    // The pet moved: reposition only. Never touch the text or restart the typing.
    place(data.tailX, data.below);
    return;
  }
  ghost.textContent = data.text;
  place(data.tailX, data.below);
  typeText(data.text, data.charMs);
  if (!wrap.classList.contains("show")) {
    // Force a reflow so the transition starts without waiting for a frame
    // (a window that has only just been shown may not be painting yet).
    void wrap.offsetWidth;
    wrap.classList.add("show");
  }
});
window.chatterBubbleAPI.onHide(() => {
  stopTyping();
  wrap.classList.remove("show");
});
// The window passes clicks through except while the pointer is on the bubble.
bubble.addEventListener("mouseenter", () => window.chatterBubbleAPI.setInteractive(true));
bubble.addEventListener("mouseleave", () => window.chatterBubbleAPI.setInteractive(false));
bubble.addEventListener("click", () => window.chatterBubbleAPI.dismiss());
</script>
</body>
</html>
