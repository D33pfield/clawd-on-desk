<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Mood</title>
<style>
* { box-sizing: border-box; }

:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --text: #18181b;
  --muted: #6b6b70;
  --border: rgba(0, 0, 0, 0.08);
  --track: rgba(0, 0, 0, 0.075);
  --mood-stress: #be123c;
  --mood-satisfaction: #16803c;
  --mood-fatigue: #0369a1;
  --mood-boredom: #a16207;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1f;
    --surface: #232327;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --border: rgba(255, 255, 255, 0.08);
    --track: rgba(255, 255, 255, 0.09);
    --mood-stress: #fb7185;
    --mood-satisfaction: #4ade80;
    --mood-fatigue: #38bdf8;
    --mood-boredom: #facc15;
  }
}

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
}

main {
  padding: 20px 20px 16px;
}

h1 {
  margin: 0 0 4px;
  font-size: 18px;
  font-weight: 600;
}

.subtitle {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}

.card {
  margin: 0;
  padding: 14px 16px;
  list-style: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.row + .row { margin-top: 14px; }

.label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
}

.track {
  display: block;
  height: 10px;
  overflow: hidden;
  border-radius: 4px;
  background: var(--track);
}

.fill {
  display: block;
  width: 0;
  height: 100%;
  border-radius: 4px;
  background: var(--bar-color);
  transition: width 0.4s ease;
}

.row[data-mood="stress"] { --bar-color: var(--mood-stress); }
.row[data-mood="satisfaction"] { --bar-color: var(--mood-satisfaction); }
.row[data-mood="fatigue"] { --bar-color: var(--mood-fatigue); }
.row[data-mood="boredom"] { --bar-color: var(--mood-boredom); }

@media (prefers-reduced-motion: reduce) {
  .fill { transition: none; }
}
</style>
</head>
<body>
<main>
  <h1>Mood</h1>
  <p class="subtitle">How the pet feels right now. Bars rise with what happens in your sessions and fade on their own.</p>
  <ul class="card">
    <li class="row" data-mood="stress">
      <span class="label">Stress</span>
      <span class="track" role="meter" aria-label="Stress" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="low"><span class="fill"></span></span>
    </li>
    <li class="row" data-mood="satisfaction">
      <span class="label">Satisfaction</span>
      <span class="track" role="meter" aria-label="Satisfaction" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="low"><span class="fill"></span></span>
    </li>
    <li class="row" data-mood="fatigue">
      <span class="label">Fatigue</span>
      <span class="track" role="meter" aria-label="Fatigue" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="low"><span class="fill"></span></span>
    </li>
    <li class="row" data-mood="boredom">
      <span class="label">Boredom</span>
      <span class="track" role="meter" aria-label="Boredom" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="low"><span class="fill"></span></span>
    </li>
  </ul>
</main>
<script src="mood-renderer.js"></script>
</body>
</html>
