name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      artifact_validation_only:
        description: "Use focused package tests for Windows while retaining full macOS/Linux tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run verify:release

  build-windows:
    needs: validate-release
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.artifact_validation_only }}
      - name: Run package validation tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_validation_only }}
        run: node --test test/assert-no-retired-telegram-sidecar.test.js test/after-pack-koffi.test.js test/audit-packaged-native.test.js test/koffi-lockfile.test.js test/native-package-target.test.js test/package-koffi-smoke.test.js test/package-build-config.test.js test/telegram-legacy-retirement.test.js test/telegram-migration-state.test.js test/telegram-migration-controller.test.js test/telegram-migration-user-data.test.js test/verify-updater-metadata.test.js test/win-foreground-terminal.test.js test/win-fullscreen-detect.test.js test/appimage-apprun.test.js test/dependency-security-floor.test.js
      - run: npx electron-builder --win --publish never
      - name: Assert retired Telegram sidecar is absent
        run: |
          node scripts/assert-no-retired-telegram-sidecar.js --resources-root dist/win-unpacked/resources --output dist/telegram-retirement-manifests/windows-x64.json
          node scripts/assert-no-retired-telegram-sidecar.js --resources-root dist/win-arm64-unpacked/resources --output dist/telegram-retirement-manifests/windows-arm64.json
      - name: Audit packaged native payloads
        run: |
          node scripts/audit-packaged-native.js --app-root dist/win-unpacked --target windows-x64 --output dist/native-package-manifests/windows-x64.json
          node scripts/audit-packaged-native.js --app-root dist/win-arm64-unpacked --target windows-arm64 --output dist/native-package-manifests/windows-arm64.json
      - name: Run native-host packaged Koffi smoke
        run: node scripts/run-packaged-koffi-smoke.js --executable "dist/win-unpacked/Clawd on Desk.exe" --target windows-x64 --output dist/koffi-smoke/windows-x64.json
      - name: Verify Windows updater metadata
        run: node scripts/verify-updater-metadata.js --metadata dist/latest.yml --artifact-root dist --contract windows --package-json package.json --output dist/updater-metadata-manifests/windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-telegram-retirement-manifests
          path: |
            dist/telegram-retirement-manifests/*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-package-audit
          path: |
            dist/koffi-prune-manifests/*.json
            dist/koffi-smoke/*.json
            dist/native-package-manifests/*.json
            dist/updater-metadata-manifests/*.json
          if-no-files-found: error

  build-mac:
    needs: validate-release
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
      - name: Prepare macOS signing credentials
        id: mac-signing
        shell: bash
        env:
          CSC_LINK_VALUE: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_VALUE: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          present=0
          for value in \
            "$CSC_LINK_VALUE" \
            "$CSC_KEY_PASSWORD_VALUE" \
            "$APPLE_API_KEY_BASE64" \
            "$APPLE_API_KEY_ID_VALUE" \
            "$APPLE_API_ISSUER_VALUE"; do
            if [[ -n "$value" ]]; then
              present=$((present + 1))
            fi
          done

          if (( present == 0 )); then
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::A tag release requires all macOS signing and notarization secrets. Refusing to build an ad-hoc official release."
              exit 1
            fi
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( present != 5 )); then
            missing=()
            [[ -n "$CSC_LINK_VALUE" ]] || missing+=(CSC_LINK)
            [[ -n "$CSC_KEY_PASSWORD_VALUE" ]] || missing+=(CSC_KEY_PASSWORD)
            [[ -n "$APPLE_API_KEY_BASE64" ]] || missing+=(APPLE_API_KEY)
            [[ -n "$APPLE_API_KEY_ID_VALUE" ]] || missing+=(APPLE_API_KEY_ID)
            [[ -n "$APPLE_API_ISSUER_VALUE" ]] || missing+=(APPLE_API_ISSUER)
            echo "::error::Incomplete macOS signing configuration. Missing: ${missing[*]}"
            exit 1
          fi

          umask 077
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_VALUE}.p8"
          if ! printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"; then
            echo "::error::APPLE_API_KEY is not valid Base64. Store the Base64-encoded .p8 file in this secret."
            exit 1
          fi
          if [[ ! -s "$api_key_path" ]]; then
            echo "::error::APPLE_API_KEY decoded to an empty file."
            exit 1
          fi
          chmod 600 "$api_key_path"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          echo "api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Build macOS (Developer ID signed and notarized)
        if: steps.mac-signing.outputs.mode == 'developer-id'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.mac-signing.outputs.api_key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npx electron-builder --mac --publish never -c.mac.identity="Developer ID Application"

      - name: Build macOS (ad-hoc manual validation only)
        if: steps.mac-signing.outputs.mode == 'adhoc'
        run: npx electron-builder --mac --publish never

      - name: Remove decoded notarization key
        if: ${{ always() && steps.mac-signing.outputs.api_key_path != '' }}
        shell: bash
        env:
          APPLE_API_KEY_FILE: ${{ steps.mac-signing.outputs.api_key_path }}
        run: rm -f -- "$APPLE_API_KEY_FILE"

      - name: Verify macOS Developer ID artifacts
        if: steps.mac-signing.outputs.mode == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail

          verify_signed_app() {
            local app="$1"
            local signature_details
            local entitlements

            signature_details="$(codesign -dv --verbose=4 "$app" 2>&1)"
            grep -q "Authority=Developer ID Application:" <<<"$signature_details"
            grep -Eq "flags=.*\\(runtime\\)" <<<"$signature_details"
            grep -Eq "^TeamIdentifier=[A-Z0-9]+$" <<<"$signature_details"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"

            entitlements="$(codesign -d --entitlements :- "$app" 2>/dev/null)"
            for entitlement in \
              com.apple.security.cs.allow-jit \
              com.apple.security.cs.allow-unsigned-executable-memory \
              com.apple.security.cs.disable-library-validation; do
              grep -q "<key>$entitlement</key>" <<<"$entitlements"
            done
          }

          verify_signed_app "dist/mac/Clawd on Desk.app"
          verify_signed_app "dist/mac-arm64/Clawd on Desk.app"

          active_mount=""
          cleanup_mount() {
            if [[ -n "$active_mount" ]]; then
              hdiutil detach "$active_mount" >/dev/null 2>&1 || true
              rmdir "$active_mount" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_mount EXIT
          shopt -s nullglob

          for arch in x64 arm64; do
            dmgs=(dist/Clawd-on-Desk-*-"$arch".dmg)
            if (( ${#dmgs[@]} != 1 )); then
              echo "Expected exactly one $arch DMG, found ${#dmgs[@]}" >&2
              exit 1
            fi

            dmg="${dmgs[0]}"
            hdiutil verify "$dmg"
            active_mount="$RUNNER_TEMP/clawd-dmg-$arch"
            mkdir "$active_mount"
            hdiutil attach -readonly -nobrowse -mountpoint "$active_mount" "$dmg"
            verify_signed_app "$active_mount/Clawd on Desk.app"
            hdiutil detach "$active_mount"
            rmdir "$active_mount"
            active_mount=""
          done

      - name: Verify macOS ad-hoc hardened signatures
        if: steps.mac-signing.outputs.mode == 'adhoc'
        shell: bash
        run: |
          set -euo pipefail
          for app in \
            "dist/mac/Clawd on Desk.app" \
            "dist/mac-arm64/Clawd on Desk.app"; do
            signature_details="$(codesign -dv --verbose=4 "$app" 2>&1)"
            grep -q "Signature=adhoc" <<<"$signature_details"
            grep -Eq "flags=.*\\(adhoc,runtime\\)" <<<"$signature_details"
            codesign --verify --deep --strict --verbose=2 "$app"

            entitlements="$(codesign -d --entitlements :- "$app" 2>/dev/null)"
            for entitlement in \
              com.apple.security.cs.allow-jit \
              com.apple.security.cs.allow-unsigned-executable-memory \
              com.apple.security.cs.disable-library-validation; do
              grep -q "<key>$entitlement</key>" <<<"$entitlements"
            done
          done
      - name: Assert retired Telegram sidecar is absent
        run: |
          node scripts/assert-no-retired-telegram-sidecar.js --resources-root "dist/mac/Clawd on Desk.app/Contents/Resources" --output dist/telegram-retirement-manifests/darwin-x64.json
          node scripts/assert-no-retired-telegram-sidecar.js --resources-root "dist/mac-arm64/Clawd on Desk.app/Contents/Resources" --output dist/telegram-retirement-manifests/darwin-arm64.json
      - name: Audit packaged native payloads
        run: |
          node scripts/audit-packaged-native.js --app-root "dist/mac/Clawd on Desk.app" --target darwin-x64 --output dist/native-package-manifests/darwin-x64.json
          node scripts/audit-packaged-native.js --app-root "dist/mac-arm64/Clawd on Desk.app" --target darwin-arm64 --output dist/native-package-manifests/darwin-arm64.json
      - name: Run native-host packaged Koffi smoke
        run: node scripts/run-packaged-koffi-smoke.js --executable "dist/mac-arm64/Clawd on Desk.app/Contents/MacOS/Clawd on Desk" --target darwin-arm64 --output dist/koffi-smoke/darwin-arm64.json
      - name: Verify macOS updater metadata
        run: node scripts/verify-updater-metadata.js --metadata dist/latest-mac.yml --artifact-root dist --contract mac --package-json package.json --output dist/updater-metadata-manifests/mac.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-installer
          path: |
            dist/*.dmg
            dist/latest-mac.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-telegram-retirement-manifests
          path: |
            dist/telegram-retirement-manifests/*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-native-package-audit
          path: |
            dist/koffi-prune-manifests/*.json
            dist/koffi-smoke/*.json
            dist/native-package-manifests/*.json
            dist/updater-metadata-manifests/*.json
          if-no-files-found: error

  build-linux:
    needs: validate-release
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # Under xvfb so the Electron-backed suites actually run here instead of
      # skipping themselves for want of a display — a silent skip on the one
      # Linux job reads exactly like a pass.
      - run: xvfb-run -a npm test
      - run: npx electron-builder --linux --publish never
      - name: Verify final AppImage AppRun search paths
        run: node scripts/verify-appimage-apprun.js --artifact dist/*.AppImage --output dist/appimage-apprun-manifests/linux-x64.json
      - name: Assert retired Telegram sidecar is absent
        run: |
          node scripts/assert-no-retired-telegram-sidecar.js --resources-root dist/linux-unpacked/resources --output dist/telegram-retirement-manifests/linux-x64.json
      - name: Audit packaged native payloads
        run: node scripts/audit-packaged-native.js --app-root dist/linux-unpacked --target linux-x64 --output dist/native-package-manifests/linux-x64.json
      - name: Configure Linux Chromium sandbox
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
      - name: Run packaged Koffi smoke
        run: node scripts/run-packaged-koffi-smoke.js --executable dist/linux-unpacked/clawd-on-desk --target linux-x64 --output dist/koffi-smoke/linux-x64.json --xvfb
      - name: Verify Linux updater metadata
        run: node scripts/verify-updater-metadata.js --metadata dist/latest-linux.yml --artifact-root dist --contract linux --package-json package.json --output dist/updater-metadata-manifests/linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-installer
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-telegram-retirement-manifests
          path: |
            dist/telegram-retirement-manifests/*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-native-package-audit
          path: |
            dist/koffi-prune-manifests/*.json
            dist/koffi-smoke/*.json
            dist/appimage-apprun-manifests/*.json
            dist/native-package-manifests/*.json
            dist/updater-metadata-manifests/*.json
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*-installer"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: docs/releases/release-${{ github.ref_name }}.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
