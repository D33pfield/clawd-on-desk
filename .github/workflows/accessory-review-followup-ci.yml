name: Accessory review follow-up CI

on:
  push:
    branches:
      - agent/accessory-aware-hitboxes

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate prospective upstream merge tree and publish temporary result
        shell: bash
        run: |
          set +e
          original_head=$(git rev-parse HEAD)
          : > /tmp/accessory-review-ci.log

          echo "=== merge latest upstream/main ===" >> /tmp/accessory-review-ci.log
          git config user.name "CheeseAgent CI"
          git config user.email "18224661+CheeseAgent@users.noreply.github.com"
          git fetch https://github.com/rullerzhou-afk/clawd-on-desk.git main:refs/remotes/upstream/main >> /tmp/accessory-review-ci.log 2>&1
          fetch_status=$?
          merge_status=99
          tested_tree="unavailable"
          if [ "$fetch_status" -eq 0 ]; then
            git merge --no-commit --no-ff refs/remotes/upstream/main >> /tmp/accessory-review-ci.log 2>&1
            merge_status=$?
            if [ "$merge_status" -eq 0 ]; then
              tested_tree=$(git write-tree)
            fi
          fi

          install_status=99
          verify_status=99
          review_status=99
          test_status=99
          if [ "$fetch_status" -eq 0 ] && [ "$merge_status" -eq 0 ]; then
            echo "=== npm ci ===" >> /tmp/accessory-review-ci.log
            npm ci >> /tmp/accessory-review-ci.log 2>&1
            install_status=$?
          fi
          if [ "$install_status" -eq 0 ]; then
            echo "=== npm run verify:electron ===" >> /tmp/accessory-review-ci.log
            npm run verify:electron >> /tmp/accessory-review-ci.log 2>&1
            verify_status=$?

            echo "=== review-targeted accessory tests ===" >> /tmp/accessory-review-ci.log
            xvfb-run -a node --test \
              test/accessory-motion-electron.test.js \
              test/accessory-review-followup.test.js \
              test/pet-accessory-hitbox.test.js \
              test/pet-geometry-main.test.js \
              test/holiday-accessory.test.js \
              test/settings-effect-router.test.js \
              test/theme-schema.test.js \
              test/pet-window-runtime.test.js >> /tmp/accessory-review-ci.log 2>&1
            review_status=$?

            echo "=== xvfb-run -a npm test ===" >> /tmp/accessory-review-ci.log
            xvfb-run -a npm test >> /tmp/accessory-review-ci.log 2>&1
            test_status=$?
          fi

          status=0
          if [ "$fetch_status" -ne 0 ] || [ "$merge_status" -ne 0 ] || [ "$install_status" -ne 0 ] || [ "$verify_status" -ne 0 ] || [ "$review_status" -ne 0 ]; then
            status=1
          fi

          # Never push the local upstream merge. Return to the exact PR head,
          # then commit only the disposable validation report.
          git reset --hard "$original_head" >> /tmp/accessory-review-ci.log 2>&1
          set -e

          {
            echo "status=$status"
            echo "fetch_status=$fetch_status"
            echo "merge_status=$merge_status"
            echo "install_status=$install_status"
            echo "verify_status=$verify_status"
            echo "review_status=$review_status"
            echo "full_test_status=$test_status"
            echo "head=$original_head"
            echo "tested_tree=$tested_tree"
            echo "--- failure contexts ---"
            grep -n -B 18 -A 36 -E '^not ok|failureType:|ERR_ASSERTION|ERR_TEST_FAILURE|Accessory motion audit failed|CONFLICT' /tmp/accessory-review-ci.log || true
            echo "--- last 180 lines ---"
            tail -n 180 /tmp/accessory-review-ci.log
          } > .accessory-review-ci-result.txt

          git add .accessory-review-ci-result.txt
          git commit -m "ci: record temporary accessory test result"
          git push origin HEAD:agent/accessory-aware-hitboxes
          cat .accessory-review-ci-result.txt
          exit "$status"
