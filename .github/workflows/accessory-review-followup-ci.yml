name: Accessory review follow-up CI

on:
  push:
    branches:
      - agent/accessory-aware-hitboxes

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install, verify, test, and publish temporary result
        shell: bash
        run: |
          set +e
          : > /tmp/accessory-review-ci.log

          echo "=== npm ci ===" >> /tmp/accessory-review-ci.log
          npm ci >> /tmp/accessory-review-ci.log 2>&1
          install_status=$?

          verify_status=99
          test_status=99
          if [ "$install_status" -eq 0 ]; then
            echo "=== npm run verify:electron ===" >> /tmp/accessory-review-ci.log
            npm run verify:electron >> /tmp/accessory-review-ci.log 2>&1
            verify_status=$?

            echo "=== xvfb-run -a npm test ===" >> /tmp/accessory-review-ci.log
            xvfb-run -a npm test >> /tmp/accessory-review-ci.log 2>&1
            test_status=$?
          fi

          status=0
          if [ "$install_status" -ne 0 ] || [ "$verify_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            status=1
          fi
          set -e

          {
            echo "status=$status"
            echo "install_status=$install_status"
            echo "verify_status=$verify_status"
            echo "test_status=$test_status"
            echo "head=$(git rev-parse HEAD)"
            echo "--- last 320 lines ---"
            tail -n 320 /tmp/accessory-review-ci.log
          } > .accessory-review-ci-result.txt

          git config user.name "CheeseAgent CI"
          git config user.email "18224661+CheeseAgent@users.noreply.github.com"
          git add .accessory-review-ci-result.txt
          git commit -m "ci: record temporary accessory test result"
          git push origin HEAD:agent/accessory-aware-hitboxes
          cat .accessory-review-ci-result.txt
          exit "$status"
